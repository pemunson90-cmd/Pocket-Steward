name: Build M8
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: chmod +x gradlew
      - run: ./gradlew clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: m8-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
