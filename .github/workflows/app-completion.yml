name: App completion validation
on:
  push:
    branches: [upgrade/app-completion]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-completion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Clean build, instrumentation compile, full unit suite, and lint
        run: ./gradlew clean assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug --stacktrace
      - name: Verify derived index migration and overlapping scopes in SQLite
        run: python tools/verify_content_scope_sql.py
      - name: Verify scoped project knowledge in SQLite
        run: python tools/verify_project_knowledge_sql.py
      - name: Verify incremental directory inventory in SQLite
        run: python tools/verify_library_refresh_sql.py
      - name: Verify release publication safety
        run: python -m unittest discover -s tools -p test_release_tools.py
      - name: Release build
        run: ./gradlew assembleRelease --stacktrace
      - name: Enforce offline-core APK invariant
        shell: bash
        run: |
          set -euo pipefail
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          if [ ! -x "$AAPT2" ]; then
            echo "Could not locate aapt2 to inspect built APK permissions."
            exit 1
          fi
          checked=0
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            checked=1
            if "$AAPT2" dump permissions "$apk" | grep -Fq 'android.permission.INTERNET'; then
              echo "Pocket Steward core APK must not request INTERNET permission: $apk"
              exit 1
            fi
          done
          if [ "$checked" -ne 1 ]; then
            echo "No built APK was found for the offline-permission gate."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-steward-app-completion-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-steward-app-completion-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-steward-app-completion-androidtest
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-steward-app-completion-lint
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
      - name: Package APK signer tooling
        if: always()
        run: |
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          TOOL_DIR="$(dirname "$APK_SIGNER")"
          mkdir -p "$RUNNER_TEMP/apksigner-tool/lib"
          cp "$APK_SIGNER" "$RUNNER_TEMP/apksigner-tool/apksigner"
          cp "$TOOL_DIR/lib/apksigner.jar" "$RUNNER_TEMP/apksigner-tool/lib/apksigner.jar"
          chmod +x "$RUNNER_TEMP/apksigner-tool/apksigner"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-steward-v1-4-apksigner-tool
          path: ${{ runner.temp }}/apksigner-tool
          if-no-files-found: warn
