name: Inbox Project Filing Integration

on:
  push:
    branches:
      - feature/inbox-project-filing

permissions:
  contents: write

jobs:
  integrate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply staged implementation
        run: |
          set -euxo pipefail
          git apply --check INBOX_PROJECT_FILING_WORKING.patch
          git apply INBOX_PROJECT_FILING_WORKING.patch
          chmod +x gradlew

      - name: Unit tests and release build
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Capture APK and signing tool
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/apksigner-tool"
          BUILD_TOOLS="$(ls -1d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          cp "$BUILD_TOOLS/apksigner" "$RUNNER_TEMP/apksigner-tool/"
          mkdir -p "$RUNNER_TEMP/apksigner-tool/lib"
          cp "$BUILD_TOOLS/lib/apksigner.jar" "$RUNNER_TEMP/apksigner-tool/lib/"
          echo "$BUILD_TOOLS" > "$RUNNER_TEMP/apksigner-tool/BUILD_TOOLS_SOURCE.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-steward-1.4.0-dev1-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: ${{ runner.temp }}/apksigner-tool
          if-no-files-found: error

      - name: Commit integrated source after green build
        run: |
          set -euxo pipefail
          git config user.name "Pocket Steward CI"
          git config user.email "actions@users.noreply.github.com"
          git rm INBOX_PROJECT_FILING_WORKING.patch
          git rm .github/workflows/inbox-project-filing-integration.yml
          git add -A
          git commit -m "Implement inbox project filing and review overhaul"
          git push origin HEAD:feature/inbox-project-filing
