name: Inbox Project Filing Build

on:
  push:
    branches:
      - feature/inbox-project-filing

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests and release build
        run: ./gradlew clean testDebugUnitTest assembleRelease --stacktrace
      - name: Capture signing utility
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/apksigner-tool/lib"
          BUILD_TOOLS="$(ls -1d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          cp "$BUILD_TOOLS/apksigner" "$RUNNER_TEMP/apksigner-tool/"
          cp "$BUILD_TOOLS/lib/apksigner.jar" "$RUNNER_TEMP/apksigner-tool/lib/"
          echo "$BUILD_TOOLS" > "$RUNNER_TEMP/apksigner-tool/BUILD_TOOLS_SOURCE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-steward-1.4.0-dev1-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: ${{ runner.temp }}/apksigner-tool
          if-no-files-found: error
