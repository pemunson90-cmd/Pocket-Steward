name: Gate V1.1 Development

on:
  push:
    branches:
      - build/v1.1-development
  workflow_dispatch:

concurrency:
  group: v1-1-development
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Enforce offline-core manifest invariant
        run: |
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "V1 core must not require INTERNET permission."
            exit 1
          fi
      - name: Clean debug release Android-test compile unit suite and lint
        run: ./gradlew clean assembleDebug assembleRelease assembleDebugAndroidTest testDebugUnitTest lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-steward-v1-1-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-steward-v1-1-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-steward-v1-1-lint
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn

  device-acceptance:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run executable V1 acceptance flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            ./gradlew connectedDebugAndroidTest --stacktrace

            # Keep a target APK installed for lifecycle/reboot smoke after the
            # instrumentation runner has finished.
            ./gradlew installDebug --stacktrace

            # Background -> foreground must preserve a launchable task.
            adb shell am start -W -n com.pocketsteward.app/.MainActivity
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell am start -W -n com.pocketsteward.app/.MainActivity
            adb shell dumpsys activity activities | grep -q "com.pocketsteward.app/.MainActivity"

            # Lock/wake/unlock around a live app task. There is no PIN on the
            # CI emulator, so this exercises lifecycle/power transitions
            # without introducing UI automation credentials.
            adb shell input keyevent KEYCODE_POWER
            sleep 2
            adb shell input keyevent KEYCODE_POWER
            adb shell input keyevent KEYCODE_MENU
            sleep 2
            adb shell am start -W -n com.pocketsteward.app/.MainActivity
            adb shell dumpsys activity activities | grep -q "com.pocketsteward.app/.MainActivity"

            # Special-storage permission loss must fail closed into onboarding,
            # not crash the process. Restore it immediately afterward so the
            # reboot smoke runs under the normal direct-storage configuration.
            adb shell appops set com.pocketsteward.app MANAGE_EXTERNAL_STORAGE deny || true
            adb shell am force-stop com.pocketsteward.app
            adb shell am start -W -n com.pocketsteward.app/.MainActivity
            adb shell pidof com.pocketsteward.app >/dev/null
            adb shell appops set com.pocketsteward.app MANAGE_EXTERNAL_STORAGE allow || true
            adb shell am force-stop com.pocketsteward.app

            # A real emulator reboot exercises manifest boot wiring and cold
            # startup against the already-created Room/DataStore files.
            adb reboot
            adb wait-for-device
            for i in $(seq 1 90); do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                break
              fi
              sleep 1
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell am start -W -n com.pocketsteward.app/.MainActivity
            adb shell dumpsys activity activities | grep -q "com.pocketsteward.app/.MainActivity"

            # Capture post-reboot logs so lifecycle failures remain inspectable
            # even when the UI itself survives.
            adb logcat -d > app/build/reports/v1-1-post-reboot-logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-steward-v1-1-device-test-results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/v1-1-post-reboot-logcat.txt
          if-no-files-found: warn
