name: Export Master Source
on:
  push:
    branches:
      - handoff/master-2026-09-19
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build source continuity package
        run: |
          mkdir -p "$RUNNER_TEMP/master-source"
          git log --oneline --decorate --all > "$RUNNER_TEMP/master-source/GIT-HISTORY.txt"
          git show-ref > "$RUNNER_TEMP/master-source/GIT-REFS.txt"
          SHIP_COMMIT="da612f04c8235870a08a637909676595f7c48cea"
          echo "$SHIP_COMMIT" > "$RUNNER_TEMP/master-source/SHIPPING-HEAD.txt"
          git show -s --format=fuller "$SHIP_COMMIT" > "$RUNNER_TEMP/master-source/SHIPPING-COMMIT.txt"
          git bundle create "$RUNNER_TEMP/master-source/Pocket-Steward-full-history.bundle" --all
          git archive --format=zip --output="$RUNNER_TEMP/master-source/Pocket-Steward-source-M11A-da612f0.zip" "$SHIP_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-steward-master-source
          path: ${{ runner.temp }}/master-source
          if-no-files-found: error
