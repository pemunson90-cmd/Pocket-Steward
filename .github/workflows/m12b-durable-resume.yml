name: Build M12B Durable Resume
on:
  push:
    branches:
      - build/m12b-durable-resume
  workflow_dispatch:
concurrency:
  group: m12b-durable-resume
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Restore canonical signing key when configured
        env:
          KEYSTORE_B64: ${{ secrets.POCKET_STEWARD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.POCKET_STEWARD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.POCKET_STEWARD_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Canonical signing secrets not configured; building a disposable debug APK."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pocket-steward.jks"
          echo "POCKET_STEWARD_KEYSTORE_PATH=$RUNNER_TEMP/pocket-steward.jks" >> "$GITHUB_ENV"
          ACTUAL="$(keytool -list -v -keystore "$RUNNER_TEMP/pocket-steward.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | sed -n 's/.*SHA256: //p' | head -1)"
          EXPECTED="B9:05:7D:D6:49:DA:EA:23:39:03:37:F2:C3:58:92:D0:EF:85:91:E5:7E:9E:9A:27:35:5E:7C:D1:1A:84:19:35"
          test "$ACTUAL" = "$EXPECTED" || { echo "Wrong signing key: $ACTUAL"; exit 1; }
      - name: Build and test
        env:
          POCKET_STEWARD_KEYSTORE_PASSWORD: ${{ secrets.POCKET_STEWARD_KEYSTORE_PASSWORD }}
          POCKET_STEWARD_KEY_ALIAS: ${{ secrets.POCKET_STEWARD_KEY_ALIAS }}
          POCKET_STEWARD_KEY_PASSWORD: ${{ secrets.POCKET_STEWARD_KEY_PASSWORD }}
        run: ./gradlew clean assembleDebug testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-steward-m12b-durable-resume-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Package local APK signer tooling
        run: |
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          TOOL_DIR="$(dirname "$APK_SIGNER")"
          mkdir -p "$RUNNER_TEMP/apksigner-tool/lib"
          cp "$APK_SIGNER" "$RUNNER_TEMP/apksigner-tool/apksigner"
          cp "$TOOL_DIR/lib/apksigner.jar" "$RUNNER_TEMP/apksigner-tool/lib/apksigner.jar"
          chmod +x "$RUNNER_TEMP/apksigner-tool/apksigner"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: ${{ runner.temp }}/apksigner-tool
