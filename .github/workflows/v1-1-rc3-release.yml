name: Build Pocket Steward 1.1 RC3

on:
  push:
    branches:
      - release/v1.1.0-rc3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Debug unit suite and lint
        run: ./gradlew clean testDebugUnitTest lintDebug --stacktrace
      - name: Release build after Room schema generation
        run: ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-steward-1.1.0-rc3-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Package apksigner
        run: |
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          TOOL_DIR="$(dirname "$APK_SIGNER")"
          mkdir -p "$RUNNER_TEMP/apksigner-tool/lib"
          cp "$APK_SIGNER" "$RUNNER_TEMP/apksigner-tool/apksigner"
          cp "$TOOL_DIR/lib/apksigner.jar" "$RUNNER_TEMP/apksigner-tool/lib/apksigner.jar"
          chmod +x "$RUNNER_TEMP/apksigner-tool/apksigner"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool-1.1-rc3
          path: ${{ runner.temp }}/apksigner-tool
          if-no-files-found: error
