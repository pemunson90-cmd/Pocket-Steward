name: Package V1.1 Handoff

on:
  push:
    branches:
      - handoff/v1.1-major-completion-20260922

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Verify source compiles
        run: ./gradlew assembleRelease testDebugUnitTest --stacktrace
      - name: Build handoff directory
        run: |
          set -eu
          ROOT="$RUNNER_TEMP/Pocket-Steward-V1.1-Handoff"
          mkdir -p "$ROOT/source" "$ROOT/build"
          rsync -a --exclude='.git' --exclude='.gradle' --exclude='**/build' ./ "$ROOT/source/"
          cp app/build/outputs/apk/release/*.apk "$ROOT/build/" || true
          cat > "$ROOT/HANDOFF_BUILD_INFO.txt" <<INFO
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Packaged UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Source excludes .git, Gradle caches, and generated build directories.
          Private signing material is NOT included.
          INFO
          (cd "$ROOT" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-steward-v1-1-full-handoff
          path: ${{ runner.temp }}/Pocket-Steward-V1.1-Handoff
          if-no-files-found: error
